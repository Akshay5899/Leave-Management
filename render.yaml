services:
  - type: web
    name: leaveflow-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
